
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちゃっぴーTCG β1.2</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:800px;padding:14px;background:#10192c;color:#fff;font-family:system-ui,-apple-system,sans-serif}
h1{font-size:23px}
h2{font-size:17px;margin:0 0 9px}
section{background:#20314c;border-radius:14px;padding:13px;margin:11px 0}
button{background:#ffd063;color:#282318;border:0;border-radius:10px;padding:10px;font-weight:650;margin:3px}
button:disabled{opacity:.4}
.card{background:#365273;color:white;border:2px solid transparent;border-radius:10px;text-align:left;min-width:110px;padding:10px;display:inline-flex;flex-direction:column;gap:4px}
.selected{border-color:#ffd063}
.slot{border:1px dashed #8196b1;border-radius:10px;padding:7px;min-height:80px;display:flex;justify-content:center;align-items:center}
.bench{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hand,.actions,.counts{display:flex;gap:5px;flex-wrap:wrap}
.counts{gap:13px;font-weight:650}
.muted,.small{color:#bbcee5;font-size:12px}
.log{white-space:pre-wrap;color:#ffe29a;min-height:40px}
.enemy{background:#46374e;border-radius:10px;padding:10px;margin:5px 0}
.notice{color:#ffe29a;font-weight:700}
.hide{display:none}
.coin{font-size:48px;text-align:center;margin:10px}
.info{border-left:3px solid #ffd063;padding-left:9px}
</style>
</head>
<body>
<h1>⚡ちゃっぴーTCG β1.2</h1>
<p class="muted">🪙 コイントス・先攻後攻テスト版。カードの能力は公式ではない仮データです。</p>

<section id="setup">
<h2>🪙 対戦開始のコイントス</h2>
<p id="coinMessage">コインの結果を予想してね！</p>
<div id="coinFace" class="coin">🪙</div>
<div id="coinButtons" class="actions">
<button id="guessHeads">オモテを予想</button>
<button id="guessTails">ウラを予想</button>
</div>
<div id="orderButtons" class="actions hide">
<button id="chooseFirst">先攻を選ぶ</button>
<button id="chooseSecond">後攻を選ぶ</button>
</div>
</section>

<section>
<h2 id="turn">対戦準備中</h2>
<div class="counts">
<span id="mineCount"></span>
<span id="cpuCount"></span>
</div>
<p class="notice" id="status"></p>
<p id="energyStatus"></p>
<p id="orderInfo" class="info"></p>
<div class="actions">
<button id="next" disabled>番を終える・CPU行動</button>
<button id="reset">新しい対戦</button>
</div>
</section>

<section>
<h2>🤖 CPUバトル場</h2>
<div id="enemy" class="enemy"></div>
<h2>CPUベンチ</h2>
<div id="enemyBench" class="bench"></div>
</section>

<section>
<h2>自分のバトル場</h2>
<div id="active" class="slot"></div>
<h2 style="margin-top:12px">ワザ</h2>
<div id="attacks" class="actions"></div>
</section>

<section>
<h2>自分のベンチ</h2>
<div id="bench" class="bench"></div>
</section>

<section>
<h2>手札</h2>
<div id="hand" class="hand"></div>
<p class="muted">たねポケモンをタップして場へ。エネルギーや進化カードは、対象のポケモンを選んでからタップしてね。</p>
</section>

<section>
<h2>選択中</h2>
<p id="selected">なし</p>
<h2>対戦ログ</h2>
<div id="log" class="log" role="status"></div>
</section>

<script>
'use strict';

// 共通コイントスエンジン
function flipCoin(){
  return Math.random()<0.5?'heads':'tails';
}
function flipCoins(n){
  return Array.from({length:n},flipCoin);
}

// すべて動作検証用の仮データ
const cards={
  pamo:{
    name:'パモ',stage:0,hp:70,
    attacks:[
      {name:'でんきショック（仮）',cost:1,damage:20}
    ]
  },
  pawmo:{
    name:'パモット',stage:1,from:'パモ',hp:90,
    attacks:[
      {name:'スパーク（仮）',cost:2,damage:40}
    ]
  },
  pawmot:{
    name:'パーモット',stage:2,from:'パモット',hp:150,
    attacks:[
      {name:'らいげき（仮）',cost:3,damage:100}
    ]
  },
  pikachu:{
    name:'ピカチュウex',stage:0,hp:190,ex:true,
    attacks:[
      {name:'でんこうせっか（仮）',cost:1,damage:30},
      {name:'10まんボルト（仮）',cost:3,damage:120}
    ]
  },
  magnemite:{
    name:'コイル',stage:0,hp:60,
    attacks:[
      {name:'たいあたり（仮）',cost:1,damage:10}
    ]
  },
  magneton:{
    name:'レアコイル',stage:1,from:'コイル',hp:100,
    attacks:[
      {name:'でんじほう（仮）',cost:2,damage:50}
    ]
  },
  energy:{
    name:'基本雷エネルギー',type:'energy'
  },
  item:{
    name:'テスト用グッズ',type:'trainer'
  }
};

const recipe={
  pamo:4,
  pawmo:4,
  pawmot:3,
  pikachu:4,
  magnemite:4,
  magneton:3,
  energy:30,
  item:8
};

const $=id=>document.getElementById(id);

let player,cpu,phase,selected;
let energyUsed,attacked,history,uid;
let firstSide,coinWinner,coinResult;
let turns={player:0,cpu:0};

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeDeck(){
  const a=[];
  for(const [k,n] of Object.entries(recipe)){
    for(let i=0;i<n;i++)a.push(k);
  }
  if(a.length!==60){
    throw Error('デッキが60枚ではありません');
  }
  return shuffle(a);
}

function draw(p){
  if(!p.deck.length)return null;
  const k=p.deck.pop();
  p.hand.push(k);
  return k;
}

function pokemon(k){
  return {
    id:++uid,
    key:k,
    entered:0,
    evolved:-1,
    energy:0,
    receivedDamage:0
  };
}

function newSide(){
  const p={
    deck:[],
    hand:[],
    prizes:[],
    active:null,
    bench:[]
  };

  do{
    p.deck=makeDeck();
    p.hand=[];
    for(let i=0;i<7;i++)draw(p);
  }while(
    !p.hand.some(k=>cards[k].stage===0)
  );

  for(let i=0;i<6;i++){
    p.prizes.push(p.deck.pop());
  }

  return p;
}

function say(s){
  history.unshift(s);
  history=history.slice(0,20);
  $('log').textContent=history.join('\n\n');
}

function takeHand(p,i){
  return p.hand.splice(i,1)[0];
}

function cpuDeploy(logs){
  while(cpu.bench.length<5){
    const i=cpu.hand.findIndex(
      k=>cards[k].stage===0
    );
    if(i<0)break;

    const k=takeHand(cpu,i);
    const m=pokemon(k);
    m.entered=turns.cpu;

    if(!cpu.active){
      cpu.active=m;
      logs.push(
        '🤖 '+cards[k].name+'をバトル場へ'
      );
    }else{
      cpu.bench.push(m);
      logs.push(
        '🤖 '+cards[k].name+'をベンチへ'
      );
    }
  }
}

function reset(){
  uid=0;
  phase='setup';
  selected=null;
  energyUsed=false;
  attacked=false;
  history=[];
  turns={player:0,cpu:0};
  firstSide=null;
  coinWinner=null;
  coinResult=null;

  player=newSide();
  cpu=newSide();

  $('setup').classList.remove('hide');
  $('coinMessage').textContent=
    'コインの結果を予想してね！';
  $('coinFace').textContent='🪙';
  $('coinButtons').classList.remove('hide');
  $('orderButtons').classList.add('hide');

  render();
  say('🪙 コイントスの予想を選んでね。');
}

function guessCoin(guess){
  if(
    phase!=='setup'||
    coinResult!==null
  )return;

  coinResult=flipCoin();
  coinWinner=
    guess===coinResult?'player':'cpu';

  $('coinFace').textContent=
    coinResult==='heads'?'🌞':'🌙';

  $('coinButtons').classList.add('hide');

  const face=
    coinResult==='heads'?'オモテ':'ウラ';

  if(coinWinner==='player'){
    $('coinMessage').textContent=
      face+'！ 予想的中！ 先攻・後攻を選んでね。';

    $('orderButtons').classList.remove('hide');

    say(
      '🪙 '+face+
      '！ 自分がコイントスに勝利。選択権を獲得！'
    );
  }else{
    $('coinMessage').textContent=
      face+'！ CPUが選択権を獲得。';

    // β1.2のCPUは先攻を選択
    say(
      '🪙 '+face+
      '！ CPUがコイントスに勝利。CPUは先攻を選択。'
    );

    setOrder('cpu');
  }
}

function setOrder(side){
  if(phase!=='setup')return;

  if(
    coinWinner==='player'&&
    side!=='player'&&
    side!=='cpu'
  )return;

  firstSide=side;
  phase='initial';

  $('setup').classList.add('hide');

  const logs=[
    '先攻：'+
    (firstSide==='player'?'自分':'CPU')+
    ' / 後攻：'+
    (firstSide==='player'?'CPU':'自分')
  ];

  // 初手のたねポケモンを自動配置
  const i=player.hand.findIndex(
    k=>cards[k].stage===0
  );
  const k=takeHand(player,i);

  player.active=pokemon(k);
  selected='active';

  logs.push(
    '自分のバトル場：'+
    cards[k].name+
    '（初手から自動配置）'
  );

  cpuDeploy(logs);

  if(firstSide==='player'){
    beginPlayerTurn(logs.join('\n'));
  }else{
    runCpuTurn(logs.join('\n'));
  }
}

function chosen(){
  return selected==='active'
    ?player.active
    :Number.isInteger(selected)
      ?player.bench[selected]
      :null;
}

function choose(s){
  if(phase==='promote'){
    if(
      !Number.isInteger(s)||
      !player.bench[s]
    ){
      return say(
        '❌ ベンチから交代先を選んでね'
      );
    }

    player.active=player.bench.splice(s,1)[0];
    selected='active';

    render();
    say(
      '🔄 '+cards[player.active.key].name+
      'をバトル場へ。'
    );

    beginPlayerTurn('CPUの番が終了。');
    return;
  }

  if(phase!=='player'||attacked){
    return say('❌ 今は選択できないよ');
  }

  if(s==='active'&&!player.active)return;
  if(Number.isInteger(s)&&!player.bench[s])return;

  selected=s;
  render();

  say('選択：'+cards[chosen().key].name);
}

function play(i){
  if(phase!=='player'||attacked){
    return say('❌ 今は手札を使えないよ');
  }

  const k=player.hand[i];
  const c=cards[k];
  if(!c)return;

  if(c.type==='trainer'){
    return say('ℹ️ グッズは未実装');
  }

  if(c.type==='energy'){
    const t=chosen();

    if(!t){
      return say(
        '❌ 先にポケモンを選んでね'
      );
    }

    if(energyUsed){
      return say(
        '❌ 手貼りは1ターン1枚まで'
      );
    }

    t.energy++;
    takeHand(player,i);
    energyUsed=true;

    render();
    return say(
      '⚡ '+cards[t.key].name+
      'にエネルギーを付けた'
    );
  }

  if(c.stage===0){
    if(!player.active){
      player.active=pokemon(k);
      player.active.entered=turns.player;
      selected='active';
    }else if(player.bench.length<5){
      const m=pokemon(k);
      m.entered=turns.player;
      player.bench.push(m);
      selected=player.bench.length-1;
    }else{
      return say('❌ ベンチは5匹まで');
    }

    takeHand(player,i);
    render();
    return say('✅ '+c.name+'を場に出した');
  }

  const t=chosen();

  if(!t){
    return say(
      '❌ 進化するポケモンを選んでね'
    );
  }

  const b=cards[t.key];

  if(
    turns.player<=1||
    t.entered===turns.player||
    t.evolved===turns.player
  ){
    return say(
      '❌ この番は進化できないよ'
    );
  }

  if(
    c.from!==b.name||
    c.stage!==b.stage+1
  ){
    return say('❌ 進化元が違うよ');
  }

  t.key=k;
  t.evolved=turns.player;
  takeHand(player,i);

  render();
  say(
    '✅ '+b.name+' → '+c.name+
    '！ エネルギーとダメージを引き継いだ'
  );
}

function finish(who,why){
  phase='over';
  render();

  say(
    (who==='player'
      ?'🏆 勝利！ '
      :'💀 敗北… ')+why
  );
}

function award(attacker,defender,defeated,logs){
  const n=cards[defeated.key].ex?2:1;

  const taken=attacker.prizes.splice(0,n);
  attacker.hand.push(...taken);

  logs.push(
    (attacker===cpu?'🤖 CPU':'自分')+
    'がサイド'+taken.length+'枚取得！'
  );

  if(attacker.prizes.length===0){
    finish(
      attacker===player?'player':'cpu',
      logs.join('\n')+
      ' サイドを取り切った！'
    );
    return true;
  }

  if(
    !defender.active&&
    !defender.bench.length
  ){
    finish(
      attacker===player?'player':'cpu',
      logs.join('\n')+
      ' 相手の場にポケモンがいない！'
    );
    return true;
  }

  return false;
}

function attack(i){
  if(
    phase!=='player'||
    attacked||
    !player.active||
    !cpu.active
  )return;

  if(
    firstSide==='player'&&
    turns.player===1
  ){
    return say(
      '❌ 先攻の最初の番はワザを使えないよ'
    );
  }

  const a=cards[player.active.key].attacks[i];
  if(!a)return;

  if(player.active.energy<a.cost){
    return say(
      '❌ エネルギー不足！ 必要'+
      a.cost+'枚、現在'+
      player.active.energy+'枚'
    );
  }

  attacked=true;
  cpu.active.receivedDamage+=a.damage;

  const logs=[
    '💥 '+a.name+'で'+
    a.damage+'ダメージ！'
  ];

  if(
    cpu.active.receivedDamage>=
    cards[cpu.active.key].hp
  ){
    const fainted=cpu.active;

    logs.push(
      '🤖 '+cards[fainted.key].name+
      'がきぜつ！'
    );

    cpu.active=null;

    if(award(player,cpu,fainted,logs))return;

    if(cpu.bench.length){
      cpu.active=cpu.bench.shift();
      logs.push(
        '🤖 '+cards[cpu.active.key].name+
        'がバトル場へ'
      );
    }
  }else{
    logs.push(
      'CPU残りHP '+
      (
        cards[cpu.active.key].hp-
        cpu.active.receivedDamage
      )
    );
  }

  render();
  say(
    logs.join('\n')+
    '\n番を終えてCPUへ。'
  );
}

function cpuEvolve(logs){
  if(turns.cpu<=1)return;

  const targets=[
    cpu.active,
    ...cpu.bench
  ].filter(Boolean);

  for(const t of targets){
    if(
      t.entered===turns.cpu||
      t.evolved===turns.cpu
    )continue;

    const b=cards[t.key];

    const i=cpu.hand.findIndex(k=>
      cards[k].stage===b.stage+1&&
      cards[k].from===b.name
    );

    if(i>=0){
      const k=takeHand(cpu,i);
      t.key=k;
      t.evolved=turns.cpu;

      logs.push(
        '🤖 '+b.name+
        ' → '+cards[k].name+
        'に進化！'
      );
    }
  }
}

function cpuAttach(logs){
  const i=cpu.hand.indexOf('energy');

  if(i<0){
    logs.push(
      '🤖 手札にエネルギーなし'
    );
    return;
  }

  const targets=[
    cpu.active,
    ...cpu.bench
  ].filter(Boolean);

  if(!targets.length)return;

  const target=
    targets.find(t=>
      t===cpu.active&&
      cards[t.key].attacks.some(
        a=>a.cost>t.energy
      )
    )||
    targets.find(t=>
      cards[t.key].attacks.some(
        a=>a.cost>t.energy
      )
    )||
    cpu.active;

  target.energy++;
  takeHand(cpu,i);

  logs.push(
    '🤖 '+cards[target.key].name+
    'にエネルギーを1枚付けた（合計'+
    target.energy+'枚）'
  );
}

function cpuAttack(logs){
  if(
    firstSide==='cpu'&&
    turns.cpu===1
  ){
    logs.push(
      '🤖 先攻1ターン目なので攻撃しない'
    );
    return 'ok';
  }

  if(!cpu.active||!player.active){
    return 'ok';
  }

  const available=
    cards[cpu.active.key].attacks.filter(
      a=>a.cost<=cpu.active.energy
    );

  if(!available.length){
    logs.push(
      '🤖 エネルギー不足で攻撃できない'
    );
    return 'ok';
  }

  available.sort(
    (a,b)=>b.damage-a.damage
  );

  const a=available[0];

  player.active.receivedDamage+=a.damage;

  logs.push(
    '💥 CPUの'+a.name+'！ '+
    a.damage+'ダメージ。自分の残りHP '+
    Math.max(
      0,
      cards[player.active.key].hp-
      player.active.receivedDamage
    )
  );

  if(
    player.active.receivedDamage>=
    cards[player.active.key].hp
  ){
    const fainted=player.active;

    logs.push(
      '💀 '+cards[fainted.key].name+
      'がきぜつ！'
    );

    player.active=null;
    selected=null;

    if(award(cpu,player,fainted,logs)){
      return 'over';
    }

    if(player.bench.length){
      return 'promote';
    }
  }

  return 'ok';
}

function beginPlayerTurn(prefix){
  if(phase==='over')return;

  if(!player.deck.length){
    return finish(
      'cpu',
      prefix+
      '\n自分が山札からカードを引けない！'
    );
  }

  turns.player++;
  energyUsed=false;
  attacked=false;
  phase='player';

  const k=draw(player);

  render();
  say(
    prefix+
    '\n📥 自分の'+
    turns.player+'番目：'+
    cards[k].name+
    'をドロー。'
  );
}

function runCpuTurn(prefix){
  if(phase==='over')return;

  phase='cpu';
  turns.cpu++;

  const logs=[
    prefix,
    '―― CPUの'+turns.cpu+'番目 ――'
  ];

  if(!cpu.deck.length){
    return finish(
      'player',
      'CPUが山札からカードを引けない！'
    );
  }

  draw(cpu);
  logs.push('🤖 山札から1枚ドロー');

  cpuDeploy(logs);
  cpuEvolve(logs);
  cpuAttach(logs);

  const result=cpuAttack(logs);

  if(result==='over')return;

  if(result==='promote'){
    phase='promote';
    render();

    say(
      logs.join('\n')+
      '\n🔄 ベンチから次のバトルポケモンを選んでね'
    );
    return;
  }

  beginPlayerTurn(logs.join('\n'));
}

function endTurn(){
  if(phase!=='player')return;

  if(!player.active){
    return say(
      '❌ バトル場にポケモンを出してね'
    );
  }

  runCpuTurn('自分の番を終了。');
}

function cardButton(k,sub,fn,sel=false){
  const c=cards[k];
  const b=document.createElement('button');

  b.className=
    'card'+(sel?' selected':'');

  const strong=document.createElement('strong');
  strong.textContent=
    (c.type==='energy'?'⚡ ':
    c.type==='trainer'?'🧰 ':'🐾 ')+
    c.name;

  const small=document.createElement('span');
  small.className='small';
  small.textContent=sub;

  b.append(strong,small);
  b.onclick=fn;

  return b;
}

function monText(m){
  const c=cards[m.key];

  return c.name+
    ' / HP '+
    Math.max(0,c.hp-m.receivedDamage)+
    '/'+c.hp+
    ' / ⚡'+m.energy;
}

function render(){
  $('turn').textContent=
    '自分 '+turns.player+
    '番 / CPU '+turns.cpu+'番';

  $('mineCount').textContent=
    '自分：山札'+player.deck.length+
    ' 手札'+player.hand.length+
    ' サイド'+player.prizes.length;

  $('cpuCount').textContent=
    'CPU：山札'+cpu.deck.length+
    ' 手札'+cpu.hand.length+
    ' サイド'+cpu.prizes.length;

  $('status').textContent=({
    setup:'🪙 コイントス待ち',
    initial:'対戦準備中',
    player:attacked
      ?'⚔️ 攻撃済み・番を終えてね'
      :'🟢 自分の操作中',
    cpu:'🤖 CPU行動中',
    promote:'🔄 ベンチから交代先を選択',
    over:'🏁 対戦終了'
  })[phase];

  $('energyStatus').textContent=
    '⚡ 手貼り：'+
    (energyUsed?'使用済み':'未使用');

  $('orderInfo').textContent=
    firstSide
      ?'先攻：'+
       (firstSide==='player'?'自分':'CPU')+
       ' / 後攻：'+
       (firstSide==='player'?'CPU':'自分')
      :'先攻・後攻は未決定';

  $('next').disabled=phase!=='player';

  $('enemy').textContent=
    cpu.active
      ?monText(cpu.active)
      :'なし';

  $('enemyBench').replaceChildren();

  cpu.bench.forEach(m=>{
    const d=document.createElement('div');
    d.className='enemy';
    d.textContent=monText(m);
    $('enemyBench').append(d);
  });

  if(!cpu.bench.length){
    $('enemyBench').textContent='ベンチなし';
  }

  $('active').replaceChildren();

  if(player.active){
    $('active').append(
      cardButton(
        player.active.key,
        monText(player.active),
        ()=>choose('active'),
        selected==='active'
      )
    );
  }else{
    $('active').textContent='空き';
  }

  $('attacks').replaceChildren();

  if(player.active){
    cards[player.active.key].attacks.forEach(
      (a,i)=>{
        const b=document.createElement('button');

        b.textContent=
          a.name+
          ' ⚡'+a.cost+
          ' / '+a.damage+'ダメージ';

        b.disabled=
          phase!=='player'||
          attacked||
          (
            firstSide==='player'&&
            turns.player===1
          );

        b.onclick=()=>attack(i);

        $('attacks').append(b);
      }
    );
  }

  $('bench').replaceChildren();

  for(let i=0;i<5;i++){
    const d=document.createElement('div');
    d.className='slot';

    if(player.bench[i]){
      d.append(
        cardButton(
          player.bench[i].key,
          monText(player.bench[i]),
          ()=>choose(i),
          selected===i
        )
      );
    }else{
      d.textContent='空き '+(i+1);
    }

    $('bench').append(d);
  }

  $('hand').replaceChildren();

  player.hand.forEach((k,i)=>{
    $('hand').append(
      cardButton(
        k,
        '手札',
        ()=>play(i)
      )
    );
  });

  const t=chosen();

  $('selected').textContent=
    t?monText(t):'なし';
}

$('guessHeads').onclick=
  ()=>guessCoin('heads');

$('guessTails').onclick=
  ()=>guessCoin('tails');

$('chooseFirst').onclick=
  ()=>setOrder('player');

$('chooseSecond').onclick=
  ()=>setOrder('cpu');

$('next').onclick=endTurn;
$('reset').onclick=reset;

reset();
</script>
</body>
</html>
