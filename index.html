
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちゃっぴーTCG β1.0</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;max-width:760px;background:#10192c;color:white;font-family:system-ui,-apple-system,sans-serif;padding:14px}
h1{font-size:23px}
h2{font-size:17px;margin:0 0 9px}
section{background:#20314c;border-radius:14px;padding:13px;margin:11px 0}
button{background:#ffd063;color:#282318;border:0;border-radius:10px;padding:10px;font-weight:650;margin:3px}
button:disabled{opacity:.45}
.card{background:#365273;color:white;border:2px solid transparent;border-radius:10px;text-align:left;min-width:110px;padding:10px;display:inline-flex;flex-direction:column;gap:4px}
.selected{border-color:#ffd063}
.slot{border:1px dashed #8196b1;border-radius:10px;padding:7px;min-height:80px;display:flex;justify-content:center;align-items:center}
.bench{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hand,.actions,.counts{display:flex;gap:5px;flex-wrap:wrap}
.counts{gap:14px;font-weight:650}
.muted,.small{color:#bbcee5;font-size:12px}
.log{white-space:pre-wrap;color:#ffe29a;min-height:40px}
.enemy{background:#46374e;border-radius:10px;padding:10px;margin:5px 0}
.notice{color:#ffe29a;font-weight:700}
</style>
</head>
<body>
<h1>⚡ちゃっぴーTCG β1.0</h1>
<p class="muted">簡易CPU対戦テスト。カードのHP・ワザ・デッキは仮設定です。</p>

<section>
<h2 id="turn"></h2>
<div class="counts">
<span id="deckCount"></span>
<span id="handCount"></span>
<span id="prizeCount"></span>
<span id="cpuPrize"></span>
</div>
<p class="notice" id="status"></p>
<p id="energyStatus"></p>
<div class="actions">
<button id="next">番を終える・CPUへ</button>
<button id="reset">新しい対戦</button>
</div>
<p class="muted">プレイヤー後攻想定の簡略テスト。CPUは自動で行動するよ。</p>
</section>

<section>
<h2>CPUバトル場</h2>
<div id="enemy" class="enemy"></div>
<h2>CPUベンチ</h2>
<div id="enemyBench" class="bench"></div>
</section>

<section>
<h2>自分のバトル場</h2>
<div id="active" class="slot"></div>
<h2 style="margin-top:12px">ワザ</h2>
<div id="attacks" class="actions"></div>
</section>

<section>
<h2>自分のベンチ</h2>
<div id="bench" class="bench"></div>
</section>

<section>
<h2>手札</h2>
<div id="hand" class="hand"></div>
<p class="muted">場のポケモンを選んでからエネルギー・進化カードをタップ。きぜつ後はベンチをタップして交代。</p>
</section>

<section>
<h2>選択中</h2>
<p id="selected">なし</p>
<h2>対戦ログ</h2>
<div id="log" class="log" role="status"></div>
</section>

<script>
'use strict';

// すべて動作検証用の仮データ。
// 公式カードの数値ではありません。
const cards={
pamo:{
name:'パモ',stage:0,hp:70,
attacks:[{name:'でんきショック（仮）',cost:1,damage:20}]
},
pawmo:{
name:'パモット',stage:1,from:'パモ',hp:90,
attacks:[{name:'スパーク（仮）',cost:2,damage:40}]
},
pawmot:{
name:'パーモット',stage:2,from:'パモット',hp:150,
attacks:[{name:'らいげき（仮）',cost:3,damage:100}]
},
pikachu:{
name:'ピカチュウex',stage:0,hp:190,ex:true,
attacks:[
{name:'でんこうせっか（仮）',cost:1,damage:30},
{name:'10まんボルト（仮）',cost:3,damage:120}
]
},
magnemite:{
name:'コイル',stage:0,hp:60,
attacks:[{name:'たいあたり（仮）',cost:1,damage:10}]
},
magneton:{
name:'レアコイル',stage:1,from:'コイル',hp:100,
attacks:[{name:'でんじほう（仮）',cost:2,damage:50}]
},
energy:{name:'基本雷エネルギー',type:'energy'},
item:{name:'テスト用グッズ',type:'trainer'}
};

const counts={
pamo:4,pawmo:4,pawmot:3,pikachu:4,
magnemite:4,magneton:3,energy:30,item:8
};

const cpuList=[
{name:'練習ポケモンA',hp:70,prize:1,cost:1,damage:20},
{name:'練習ポケモンex B',hp:110,prize:2,cost:2,damage:40},
{name:'練習ポケモンC',hp:90,prize:1,cost:2,damage:30},
{name:'練習ポケモンex D',hp:140,prize:2,cost:3,damage:60}
];

let turn,deck,hand,prizes,active,bench,selected;
let enemy,enemyBench,cpuTaken,energyUsed,phase,uid;

const $=id=>document.getElementById(id);

function say(s){
$('log').textContent=s;
}

function shuffle(a){
a=a.slice();
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

function makeDeck(){
let a=[];
for(const [k,n] of Object.entries(counts)){
for(let i=0;i<n;i++)a.push(k);
}
if(a.length!==60)throw Error('60枚ではない');
return shuffle(a);
}

function draw(){
if(!deck.length)return null;
let k=deck.pop();
hand.push(k);
return k;
}

function mon(k){
return {
id:++uid,key:k,entered:turn,
evolved:-1,energy:[],damage:0
};
}

function reset(){
turn=1;
uid=0;
active=null;
bench=[];
selected=null;
cpuTaken=0;
energyUsed=false;
phase='player';

let retries=0;
do{
deck=makeDeck();
hand=[];
for(let i=0;i<7;i++)draw();
if(hand.some(k=>cards[k].stage===0))break;
retries++;
}while(true);

prizes=[];
for(let i=0;i<6;i++)prizes.push(deck.pop());

let first=draw();

enemy={...cpuList[0],damage:0,energy:0};
enemyBench=cpuList.slice(1).map(x=>({
...x,damage:0,energy:0
}));

render();
say(
'対戦開始！ 1ターン目のドロー：'+
cards[first].name+'。'+
(retries?'引き直し'+retries+'回。':'')+
'たねポケモンを配置しよう。'
);
}

function chosen(){
return selected==='active'
?active
:Number.isInteger(selected)?bench[selected]:null;
}

function selectSlot(s){
if(phase==='promote'){
if(!Number.isInteger(s)||!bench[s]){
return say('❌ ベンチから交代先を選んでね');
}
active=bench.splice(s,1)[0];
selected='active';
phase='player';
render();
return say(
'🔄 '+cards[active.key].name+
'をバトル場へ！ 自分の番を続けよう。'
);
}

if(phase!=='player'){
return say('❌ 今は操作できないよ');
}

if(
(s==='active'&&!active)||
(Number.isInteger(s)&&!bench[s])
)return;

selected=s;
render();
say('選んだポケモンにエネルギーや進化カードを使えるよ。');
}

function play(i){
if(phase!=='player'){
return say('❌ 今は手札を使えないよ');
}

const k=hand[i],c=cards[k];
if(!c)return;

if(c.type==='trainer'){
return say('ℹ️ グッズは未実装だよ');
}

if(c.type==='energy'){
let t=chosen();
if(!t)return say('❌ 先にポケモンを選んでね');
if(energyUsed){
return say('❌ 手貼りは1ターンに1枚まで！');
}
t.energy.push(k);
hand.splice(i,1);
energyUsed=true;
render();
return say(
'⚡ '+cards[t.key].name+
'にエネルギーを付けたよ'
);
}

if(c.stage===0){
if(!active){
active=mon(k);
selected='active';
}else if(bench.length<5){
bench.push(mon(k));
selected=bench.length-1;
}else{
return say('❌ ベンチは5匹まで');
}
hand.splice(i,1);
render();
return say('✅ '+c.name+'を場に出したよ');
}

let t=chosen();
if(!t){
return say('❌ 進化するポケモンを選んでね');
}

let b=cards[t.key];

if(turn===1||t.entered===turn){
return say('❌ このポケモンはまだ進化できないよ');
}
if(t.evolved===turn){
return say('❌ 同じ番に再進化できないよ');
}
if(c.from!==b.name||c.stage!==b.stage+1){
return say('❌ 進化元が違うよ');
}

t.key=k;
t.evolved=turn;
hand.splice(i,1);
render();
say(
'✅ '+b.name+' → '+c.name+
'に進化！ エネルギーはそのままだよ'
);
}

function finish(winner,why){
phase='over';
render();
say(
(winner==='player'?'🏆 勝利！ ':'💀 敗北… ')+why
);
}

function playerAttack(i){
if(phase!=='player'||!active||!enemy)return;

let a=cards[active.key].attacks[i];
if(!a)return;

if(active.energy.length<a.cost){
return say(
'❌ エネルギー不足！ 必要'+
a.cost+'枚、現在'+active.energy.length+'枚'
);
}

enemy.damage+=a.damage;

let msg=
'💥 '+a.name+'で'+a.damage+'ダメージ！ ';

if(enemy.damage>=enemy.hp){
let defeated=enemy;
let taken=prizes.splice(0,defeated.prize);
hand.push(...taken);

msg+=defeated.name+
'がきぜつ！ サイド'+taken.length+'枚獲得。 ';

if(prizes.length===0){
return finish(
'player',
msg+'サイドを取り切った！'
);
}

if(!enemyBench.length){
return finish(
'player',
msg+'CPUの場にポケモンがいなくなった！'
);
}

enemy=enemyBench.shift();
msg+='CPUは'+enemy.name+'を出した。 ';
}else{
msg+='相手の残りHP '+
(enemy.hp-enemy.damage)+'。 ';
}

phase='cpu';
render();
say(msg+'CPUの番へ進んでね。');
}

function cpuTurn(){
if(phase!=='cpu')return;

let logs=[];

if(enemy){
enemy.energy++;

logs.push(
'CPUは'+enemy.name+
'にエネルギーを1枚付けた。'
);

if(enemy.energy>=enemy.cost){
if(!active){
finish('cpu','自分のバトル場が空だよ');
return;
}

active.damage+=enemy.damage;

logs.push(
'CPUのワザ！ '+enemy.damage+'ダメージ。'
);

if(active.damage>=cards[active.key].hp){
let fainted=cards[active.key];

cpuTaken+=fainted.ex?2:1;

logs.push(
fainted.name+
'がきぜつ！ CPUがサイド'+
(fainted.ex?2:1)+'枚獲得。'
);

active=null;
selected=null;

if(cpuTaken>=6){
return finish(
'cpu',
logs.join('\n')+
' CPUがサイド6枚獲得。'
);
}

if(!bench.length){
return finish(
'cpu',
logs.join('\n')+
' 自分の場にポケモンがいない。'
);
}

phase='promote';
render();
return say(
logs.join('\n')+
'\n🔄 ベンチから次のバトルポケモンを選んでね。'
);
}
}else{
logs.push(
'CPUは必要エネルギーが足りず攻撃できない。'
);
}
}

if(!deck.length){
return finish(
'cpu',
logs.join('\n')+
' 次の自分の番に山札を引けない。'
);
}

turn++;
energyUsed=false;
phase='player';

let k=draw();
render();

say(
logs.join('\n')+
'\n📥 自分の'+turn+
'番目！ '+cards[k].name+'を引いたよ。'
);
}

function next(){
if(phase==='over')return;

if(phase==='promote'){
return say(
'❌ まずベンチからバトルポケモンを選んでね'
);
}

if(phase==='cpu'){
return cpuTurn();
}

if(!active){
return say(
'❌ まずバトル場にポケモンを出してね'
);
}

phase='cpu';
render();
say(
'自分の番を終了したよ。「CPUの番を進める」を押してね。'
);
}

function cardButton(k,sub,fn,sel=false){
let c=cards[k];
let b=document.createElement('button');

b.className='card'+(sel?' selected':'');

let strong=document.createElement('strong');
strong.textContent=
(c.type==='energy'?'⚡ ':
c.type==='trainer'?'🧰 ':'🐾 ')+c.name;

let small=document.createElement('span');
small.className='small';
small.textContent=sub;

b.append(strong,small);
b.onclick=fn;
return b;
}

function render(){
$('turn').textContent='自分の番：'+turn;
$('deckCount').textContent='山札 '+deck.length;
$('handCount').textContent='手札 '+hand.length;
$('prizeCount').textContent=
'自分の残りサイド '+prizes.length;
$('cpuPrize').textContent=
'CPU取得サイド '+cpuTaken+'/6';

$('status').textContent={
player:'🟢 自分の操作中',
cpu:'🤖 CPUの番',
promote:'🔄 交代先を選択',
over:'🏁 対戦終了'
}[phase];

$('energyStatus').textContent=
'⚡ 手貼り：'+
(energyUsed?'使用済み':'未使用');

$('next').textContent=
phase==='cpu'
?'CPUの番を進める'
:'番を終える・CPUへ';

$('next').disabled=
phase==='over'||phase==='promote';

$('enemy').textContent=enemy
?enemy.name+
' / HP '+Math.max(0,enemy.hp-enemy.damage)+
'/'+enemy.hp+
' / ⚡'+enemy.energy+
'枚 / サイド'+enemy.prize
:'なし';

$('enemyBench').replaceChildren();

enemyBench.forEach(e=>{
let d=document.createElement('div');
d.className='enemy';
d.textContent=
e.name+' HP '+e.hp+
' / サイド'+e.prize;
$('enemyBench').append(d);
});

if(!enemyBench.length){
$('enemyBench').textContent='ベンチなし';
}

$('active').replaceChildren();

if(active){
$('active').append(
cardButton(
active.key,
'HP '+
Math.max(0,cards[active.key].hp-active.damage)+
'/'+cards[active.key].hp+
' ⚡'+active.energy.length,
()=>selectSlot('active'),
selected==='active'
)
);
}else{
$('active').textContent='空き';
}

$('attacks').replaceChildren();

if(active){
cards[active.key].attacks.forEach((a,i)=>{
let b=document.createElement('button');
b.textContent=
a.name+' ⚡'+a.cost+
' / '+a.damage+'ダメージ';
b.disabled=phase!=='player';
b.onclick=()=>playerAttack(i);
$('attacks').append(b);
});
}

$('bench').replaceChildren();

for(let i=0;i<5;i++){
let d=document.createElement('div');
d.className='slot';

if(bench[i]){
d.append(
cardButton(
bench[i].key,
'HP '+
Math.max(0,cards[bench[i].key].hp-bench[i].damage)+
'/'+cards[bench[i].key].hp+
' ⚡'+bench[i].energy.length,
()=>selectSlot(i),
selected===i
)
);
}else{
d.textContent='空き '+(i+1);
}

$('bench').append(d);
}

$('hand').replaceChildren();

hand.forEach((k,i)=>{
$('hand').append(
cardButton(k,'手札',()=>play(i))
);
});

let t=chosen();

$('selected').textContent=t
?cards[t.key].name+
' ⚡'+t.energy.length+'枚'
:'なし';
}

$('next').onclick=next;
$('reset').onclick=reset;

reset();
</script>
</body>
</html>
