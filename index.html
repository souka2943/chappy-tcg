
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ちゃっぴーTCG β0.5</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;background:#10192c;color:white;font-family:-apple-system,sans-serif;padding:16px;max-width:720px}
h1{font-size:24px}
h2{font-size:18px;margin:0 0 12px}
section{background:#20314c;padding:15px;border-radius:14px;margin:12px 0}
button{padding:12px;border:0;border-radius:10px;background:#ffd063;color:#252018;font-size:15px;font-weight:600;margin:3px}
.card{display:inline-flex;flex-direction:column;justify-content:center;gap:5px;background:#365273;color:white;border:2px solid transparent;border-radius:12px;padding:12px;min-height:88px;min-width:120px;text-align:left}
.card.selected{border-color:#ffd063;background:#456688}
.slot{border:1px dashed #6e87a7;border-radius:12px;min-height:98px;padding:8px;display:flex;align-items:center;justify-content:center}
.bench{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hand,.controls{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:#afc2db;font-size:13px}
.log{color:#ffe194;min-height:42px;white-space:pre-wrap}
.tag{font-size:12px;color:#b9d4ee}
#selected{font-size:14px;color:#ffe194}
</style>
</head>
<body>
<h1>⚡ちゃっぴーTCG β0.5</h1>
<p class="muted">対戦フィールド・通常進化の操作テスト</p>
<section>
<h2 id="turn"></h2>
<div class="controls">
<button id="next">次の自分の番へ</button>
<button id="reset">最初から</button>
</div>
<p class="muted">※相手の番は省略したテスト用進行だよ</p>
</section>
<section>
<h2>バトル場</h2>
<div id="active" class="slot"></div>
</section>
<section>
<h2>ベンチ（最大5匹）</h2>
<div id="bench" class="bench"></div>
</section>
<section>
<h2>手札</h2>
<div id="hand" class="hand"></div>
<p class="muted">たねポケモンはタップして配置。進化するときは場のポケモンを先に選んでね。</p>
</section>
<section>
<h2>選択中</h2>
<p id="selected">なし</p>
<h2>判定ログ</h2>
<div id="log" class="log" role="status"></div>
</section>
<script>
'use strict';
const catalog={
pamo:{name:'パモ',stage:0},
pawmot1:{name:'パモット',stage:1,from:'パモ'},
pawmot2:{name:'パーモット',stage:2,from:'パモット'},
pikachu:{name:'ピカチュウex',stage:0},
magnemite:{name:'コイル',stage:0},
magneton:{name:'レアコイル',stage:1,from:'コイル'}
};
let turn,active,bench,hand,selected,uid;
const $=id=>document.getElementById(id);
function message(s){$('log').textContent=s}
function newPokemon(key){
return {uid:++uid,key,entered:turn,evolved:-1,damage:0,energy:[]}
}
function reset(){
turn=1;uid=0;active=null;bench=[];selected=null;
hand=['pamo','pawmot1','pawmot2','pikachu','magnemite','magneton','pamo'];
render();
message('手札のたねポケモンをタップしてバトル場に出そう！');
}
function chosen(){
if(selected==='active')return active;
if(Number.isInteger(selected))return bench[selected];
return null;
}
function selectSlot(slot){
if(slot==='active'&&!active)return;
if(Number.isInteger(slot)&&!bench[slot])return;
selected=slot;
render();
message('進化できるカードを手札から選んでね。');
}
function play(i){
const key=hand[i],card=catalog[key];
if(!card)return;
if(card.stage===0){
if(!active){
active=newPokemon(key);
selected='active';
}else if(bench.length<5){
bench.push(newPokemon(key));
selected=bench.length-1;
}else{
return message('❌ ベンチは5匹までだよ！');
}
hand.splice(i,1);
render();
return message('✅ '+card.name+'を場に出したよ！');
}
const target=chosen();
if(!target)return message('❌ 先に場のポケモンを選んでね！');
const base=catalog[target.key];
if(turn===1)return message('❌ 最初の自分の番には進化できないよ！');
if(target.entered===turn)return message('❌ この番に場に出したポケモンは進化できないよ！');
if(target.evolved===turn)return message('❌ この番に進化したポケモンは再進化できないよ！');
if(card.from!==base.name||card.stage!==base.stage+1){
return message('❌ 進化元が違うよ！ '+card.name+'は「'+card.from+'」から進化するカードだよ。');
}
target.key=key;
target.evolved=turn;
hand.splice(i,1);
render();
message('✅ '+base.name+'から'+card.name+'に進化成功！');
}
function cardButton(key,caption,onClick,isSelected=false){
const c=catalog[key];
const b=document.createElement('button');
b.className='card'+(isSelected?' selected':'');
const name=document.createElement('strong');
name.textContent='⚡ '+c.name;
const stage=document.createElement('span');
stage.className='tag';
stage.textContent=['たね','1進化','2進化'][c.stage]+(c.from?' / '+c.from+'から進化':'');
b.append(name,stage);
if(caption){
const cap=document.createElement('span');
cap.className='tag';
cap.textContent=caption;
b.append(cap);
}
b.addEventListener('click',onClick);
return b;
}
function render(){
$('turn').textContent='自分の番：'+turn;
$('active').replaceChildren();
if(active){
$('active').append(cardButton(active.key,'バトル場',()=>selectSlot('active'),selected==='active'));
}else{
$('active').textContent='空き';
}
$('bench').replaceChildren();
for(let i=0;i<5;i++){
const div=document.createElement('div');
div.className='slot';
if(bench[i]){
div.append(cardButton(bench[i].key,'ベンチ '+(i+1),()=>selectSlot(i),selected===i));
}else{
div.textContent='空き '+(i+1);
div.classList.add('muted');
}
$('bench').append(div);
}
$('hand').replaceChildren();
hand.forEach((key,i)=>$('hand').append(cardButton(key,'手札',()=>play(i))));
const target=chosen();
$('selected').textContent=target?catalog[target.key].name+'（'+(selected==='active'?'バトル場':'ベンチ '+(selected+1))+'）':'なし';
}
$('next').addEventListener('click',()=>{
turn++;
render();
message('自分の番が進んだよ！');
});
$('reset').addEventListener('click',reset);
reset();
</script>
</body>
</html>
